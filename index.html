<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sachin Shakya — CloudOps Technical Lead</title>
    <meta
      name="description"
      content="AI-native CloudOps Technical Lead with ~9 years across Azure and AWS. FinOps, SRE, and automation — $2M/year in cloud savings and 40% faster incident resolution."
    />
    <meta name="author" content="Sachin Shakya" />
    <meta property="og:title" content="Sachin Shakya — CloudOps Technical Lead" />
    <meta
      property="og:description"
      content="Nine years in cloud operations, keeping multi-tenant Azure platforms fast, observable, and considerably cheaper."
    />
    <meta property="og:type" content="profile" />
    <!-- Fonts: Archivo (display), IBM Plex Sans (body), IBM Plex Mono (mono) — matching reference design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        let stored;
        let theme;
        try {
          stored = localStorage.getItem("theme");
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
