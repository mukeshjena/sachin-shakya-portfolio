name: Deploy to Cloudflare Workers (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/v1.0.0]
  workflow_dispatch:

# Concurrency group ensures atomic, zero-downtime deployments by cancelling outdated in-progress runs
concurrency:
  group: production-cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-and-deploy:
    name: Build, Audit Secrets & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Step 1: Pre-flight Secrets Validation
      - name: Audit & Validate GitHub Secrets
        env:
          CHECK_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHECK_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECK_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CHECK_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CHECK_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CHECK_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          CHECK_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CHECK_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CHECK_EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
          CHECK_SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          echo "=========================================================="
          echo "Pre-flight Secrets Audit for Sachin Shakya Deployment"
          echo "=========================================================="

          ERRORS=0

          check_secret() {
            local name="$1"
            local val="$2"
            local required="$3"

            if [ -n "$val" ]; then
              echo "  ✓ $name: Configured"
            else
              if [ "$required" = "true" ]; then
                echo "  ✗ $name: MISSING (Required for deployment)"
                ERRORS=$((ERRORS + 1))
              else
                echo "  • $name: Not Set (Optional / configured in subsequent steps)"
              fi
            fi
          }

          echo "Cloudflare Core Credentials:"
          check_secret "CLOUDFLARE_API_TOKEN" "$CHECK_CF_API_TOKEN" "true"
          check_secret "CLOUDFLARE_ACCOUNT_ID" "$CHECK_CF_ACCOUNT_ID" "true"

          echo ""
          echo "Cloudinary Media Credentials:"
          check_secret "CLOUDINARY_CLOUD_NAME" "$CHECK_CLOUDINARY_CLOUD_NAME" "false"
          check_secret "CLOUDINARY_API_KEY" "$CHECK_CLOUDINARY_API_KEY" "false"
          check_secret "CLOUDINARY_API_SECRET" "$CHECK_CLOUDINARY_API_SECRET" "false"

          echo ""
          echo "Firebase Production Credentials:"
          check_secret "FIREBASE_API_KEY" "$CHECK_FIREBASE_API_KEY" "false"
          check_secret "FIREBASE_PROJECT_ID" "$CHECK_FIREBASE_PROJECT_ID" "false"
          check_secret "FIREBASE_SERVICE_ACCOUNT_JSON" "$CHECK_FIREBASE_SERVICE_ACCOUNT" "false"

          echo ""
          echo "Application & Integration Endpoints:"
          check_secret "EMAIL_API_URL" "$CHECK_EMAIL_API_URL" "false"
          check_secret "SITE_URL" "$CHECK_SITE_URL" "false"

          echo "=========================================================="
          if [ $ERRORS -gt 0 ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Pre-flight check failed with $ERRORS missing required secrets."
            echo "Please configure the missing secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          else
            echo "All required credentials validated successfully."
          fi

      # Step 2: Install Dependencies
      - name: Install dependencies
        env:
          npm_config_loglevel: error
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Step 3: Security Audit
      - name: Security Audit
        timeout-minutes: 1
        run: timeout 20s npm audit --audit-level=high --fetch-retries=0 || true
        continue-on-error: true

      # Step 4: Code Quality Checks (Biome CI Gate) & Strict Typecheck
      - name: Run Biome CI Linter & Code Quality Gate
        run: npm run check:ci

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      # Step 5: Build React Application (Pure Static Build - Secrets Managed Directly by Worker)
      - name: Build React Application (with Hashed Static Assets)
        run: npm run build

      # Step 6: Bundle Size Budgets
      - name: Enforce Bundle Size Budgets
        run: |
          echo "=========================================================="
          echo "Checking bundle size budgets..."
          echo "=========================================================="

          BUDGET_INDEX_KB=1000
          BUDGET_TOTAL_JS_KB=3000
          ERRORS=0

          check_size() {
            local label="$1"
            local pattern="$2"
            local budget_kb="$3"
            local file
            file=$(find dist/assets -name "$pattern" -type f 2>/dev/null | head -n 1)
            if [ -n "$file" ] && [ -f "$file" ]; then
              local size_bytes
              size_bytes=$(wc -c < "$file")
              local size_kb=$(( size_bytes / 1024 ))
              if [ "$size_kb" -gt "$budget_kb" ]; then
                echo "  ✗ $label: ${size_kb} KB - exceeds budget of ${budget_kb} KB"
                ERRORS=$((ERRORS + 1))
              else
                echo "  ✓ $label: ${size_kb} KB / ${budget_kb} KB budget"
              fi
            else
              echo "  • $label: file matching '$pattern' not found, skipping"
            fi
          }

          check_size "index chunk" "index-*.js" "$BUDGET_INDEX_KB"

          TOTAL_JS_KB=$(find dist/assets -name "*.js" ! -name "*.map" -type f -exec wc -c {} + 2>/dev/null | awk '$2 != "total" {s+=$1} END {print int(s/1024)}')
          if [ -n "$TOTAL_JS_KB" ] && [ "$TOTAL_JS_KB" -gt "$BUDGET_TOTAL_JS_KB" ]; then
            echo "  ✗ Total JS: ${TOTAL_JS_KB} KB - exceeds budget of ${BUDGET_TOTAL_JS_KB} KB"
            ERRORS=$((ERRORS + 1))
          else
            echo "  ✓ Total JS: ${TOTAL_JS_KB:-0} KB / ${BUDGET_TOTAL_JS_KB} KB budget"
          fi

          echo "=========================================================="
          if [ $ERRORS -gt 0 ]; then
            echo "Bundle size budget exceeded."
            exit 1
          else
            echo "All bundle size budgets passed."
          fi

      # Step 7: Dependency Freshness Report
      - name: Dependency Freshness Report
        run: |
          echo "=========================================================="
          echo "Outdated Dependency Report (informational)"
          echo "=========================================================="
          npm outdated || true
        continue-on-error: true

      # Step 8: Atomic Zero-Downtime Deployment to Cloudflare Edge (Main Only)
      - name: Atomic Deploy to Cloudflare Edge Network (0 Downtime)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "=========================================================="
          echo "Deploying Static Assets to Cloudflare Global Edge..."
          echo "=========================================================="
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      # Step 8a: Sync secrets to Cloudflare Worker secret store (post-deploy)
      - name: Sync All Secrets to Cloudflare Worker
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          _FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          _FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          _FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          _FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          _FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          _FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          _FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          _FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          _CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          _CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          _CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          _EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
          _EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          _EMAIL_PROFILE: ${{ secrets.EMAIL_PROFILE }}
          _SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          echo "=========================================================="
          echo "Syncing secrets to Cloudflare Worker secret store"
          echo "=========================================================="

          WORKER="sachin-shakya-portfolio"
          SYNCED=0
          SKIPPED=0

          sync_secret() {
            local worker_key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$worker_key" --name "$WORKER" \
                && echo "  ✓ $worker_key" \
                && SYNCED=$((SYNCED + 1)) \
                || echo "  ✗ $worker_key - sync failed (non-fatal)"
            else
              echo "  • $worker_key - not set, skipping"
              SKIPPED=$((SKIPPED + 1))
            fi
          }

          sync_secret "FIREBASE_API_KEY"              "$_FIREBASE_API_KEY"
          sync_secret "FIREBASE_AUTH_DOMAIN"          "$_FIREBASE_AUTH_DOMAIN"
          sync_secret "FIREBASE_PROJECT_ID"           "$_FIREBASE_PROJECT_ID"
          sync_secret "FIREBASE_STORAGE_BUCKET"       "$_FIREBASE_STORAGE_BUCKET"
          sync_secret "FIREBASE_MESSAGING_SENDER_ID"  "$_FIREBASE_MESSAGING_SENDER_ID"
          sync_secret "FIREBASE_APP_ID"               "$_FIREBASE_APP_ID"
          sync_secret "FIREBASE_MEASUREMENT_ID"       "$_FIREBASE_MEASUREMENT_ID"
          sync_secret "FIREBASE_SERVICE_ACCOUNT_JSON" "$_FIREBASE_SERVICE_ACCOUNT_JSON"
          sync_secret "CLOUDINARY_CLOUD_NAME"         "$_CLOUDINARY_CLOUD_NAME"
          sync_secret "CLOUDINARY_API_KEY"            "$_CLOUDINARY_API_KEY"
          sync_secret "CLOUDINARY_API_SECRET"         "$_CLOUDINARY_API_SECRET"
          sync_secret "EMAIL_API_URL"                 "$_EMAIL_API_URL"
          sync_secret "EMAIL_RECIPIENT"               "$_EMAIL_RECIPIENT"
          sync_secret "EMAIL_PROFILE"                 "$_EMAIL_PROFILE"
          sync_secret "SITE_URL"                      "$_SITE_URL"

          echo "=========================================================="
          echo "Synced: $SYNCED secrets | Skipped: $SKIPPED"

      # Step 9: Live Health Check
      - name: Verify Live Deployment Health
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "=========================================================="
          echo "Running live edge health check..."
          echo "=========================================================="
          HEALTH_URL="https://shakya.mukeshjena.com"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Deployment is HEALTHY (HTTP 200 OK): $HEALTH_URL"
          else
            FALLBACK_URL="https://sachin-shakya-portfolio.muk3shjena.workers.dev"
            echo "Primary URL check returned HTTP $HTTP_STATUS ($HEALTH_URL), verifying worker fallback $FALLBACK_URL..."
            FB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FALLBACK_URL" || echo "000")
            if [ "$FB_STATUS" = "200" ]; then
              echo "Worker endpoint is HEALTHY (HTTP 200 OK): $FALLBACK_URL"
            else
              echo "Worker check returned HTTP $FB_STATUS"
            fi
          fi

      # Step 10: PR Preview Deployment (PRs Only)
      - name: Deploy PR Preview to Staging Worker
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not configured - skipping preview deployment."
            exit 0
          fi
          echo "=========================================================="
          echo "Deploying PR #${{ github.event.pull_request.number }} preview..."
          echo "=========================================================="
          PREVIEW_NAME="sachin-shakya-pr-${{ github.event.pull_request.number }}"
          npx wrangler deploy --name "$PREVIEW_NAME"
          PREVIEW_URL="https://${PREVIEW_NAME}.muk3shjena.workers.dev"
          echo "PR Preview deployed: $PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

      - name: Comment PR Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            if (!previewUrl) {
              console.log("No PREVIEW_URL set - skipping comment.");
              return;
            }
            const body = [
              '## 🚀 PR Preview Deployment',
              '',
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Commit** | \`${{ github.sha }}\` |`,
              '',
              '> Preview Worker is ephemeral - it can be cleaned up when this PR is merged or closed.',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
