# wrangler.toml — Cloudflare Workers configuration for Sachin Shakya Portfolio
# Step 5: Static asset deploy via Workers Static Assets

name = "sachin-shakya-portfolio"
compatibility_date = "2025-09-01"
workers_dev = true
main = "worker/index.ts"

[[routes]]
pattern = "shakya.mukeshjena.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true
